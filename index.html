<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bountiful Blessings - Private Access</title>
  <style>
    :root {
      --brand: #70a47b;
      --brand-dark: #5a8866;
      --surface: #fff7eb;
      --background: linear-gradient(135deg, #f5e8dc 0%, #ffe5b4 100%);
      --text: #333;
      --error: #d9534f;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      text-align: center;
      padding: 60px 20px;
      margin: 0;
    }

    header {
      background: #ffb27f;
      padding: 20px 0;
      color: white;
      font-size: 1.5em;
      font-weight: bold;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    .card {
      background: white;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      margin: auto;
      border-radius: 14px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      color: var(--text);
      margin-top: 0;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="password"] {
      padding: 12px;
      width: 100%;
      font-size: 1em;
      border-radius: 10px;
      border: 1px solid #ccc;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="password"]:focus {
      border-color: var(--brand);
      outline: none;
      box-shadow: 0 0 0 3px rgba(112, 164, 123, 0.2);
    }

    button {
      background: var(--brand);
      color: white;
      padding: 12px 24px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: var(--brand-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    .error {
      color: var(--error);
      margin-top: 12px;
      min-height: 24px;
    }

    .hidden-content {
      display: none;
      width: 100%;
      max-width: 980px;
    }

    .content-container {
      background: var(--surface);
      padding: 24px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .presentation-container {
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    iframe {
      border: 0;
      width: 100%;
      height: 569px;
    }
  </style>
</head>
<body>
  <header>Bountiful Blessings of Charlotte County Inc</header>

  <main>
    <section class="card" id="login-box" aria-label="Private access form">
      <h1>Private Area</h1>
      <p>Please enter the access password:</p>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" />
      <button type="button" id="access-button">Access</button>
      <div class="error" id="error-message" role="alert" aria-live="polite"></div>
    </section>

    <section class="hidden-content" id="private-content" aria-label="Private content">
      <div class="content-container">
        <h2>Food Pantry Schedule</h2>
        <div class="presentation-container">
          <iframe
            src="https://docs.google.com/presentation/d/e/2PACX-1vQUlsBjGyFOn6K5lJwZuCkgcBwhWLnIDj-kbprtEZa-1rpYw3MlgtN_uyqnGt1mEbcjEghY4JMJepQr/pubembed?start=true&loop=true&delayms=5000"
            allowfullscreen
            referrerpolicy="no-referrer"
            loading="lazy"
            title="Food Pantry Schedule"
          ></iframe>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CORRECT_PASSWORD = "Greendoor22";
    const passwordField = document.getElementById("password");
    const errorMessage = document.getElementById("error-message");
    const loginBox = document.getElementById("login-box");
    const privateContent = document.getElementById("private-content");
    const accessButton = document.getElementById("access-button");

    function showContent() {
      loginBox.style.display = "none";
      privateContent.style.display = "block";
    }

    function resetError() {
      errorMessage.textContent = "";
    }

    function handleAccessAttempt() {
      const entered = passwordField.value.trim();

      if (!entered) {
        errorMessage.textContent = "Por favor, ingrese la contraseña.";
        passwordField.focus();
        return;
      }

      if (entered === CORRECT_PASSWORD) {
        localStorage.setItem("privateAccess", "true");
        resetError();
        showContent();
      } else {
        errorMessage.innerHTML =
          "⚠️ La contraseña que ingresó no es correcta. <br>Usted no está autorizado para acceder a esta sección del sitio.<br>Por favor, inténtelo nuevamente.";
        passwordField.focus();
        passwordField.select();
      }
    }

    accessButton.addEventListener("click", handleAccessAttempt);
    passwordField.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        handleAccessAttempt();
      }
    });

    if (localStorage.getItem("privateAccess") === "true") {
      showContent();
    }
  </script>
</body>
</html>
